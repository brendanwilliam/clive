name: iPhoneTerminalMac
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  IPhoneTerminal:
    path: ../..
targets:
  iPhoneTerminalMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - path: ../../Sources/IPhoneTerminalDaemon
        excludes: [main.swift]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iPhoneTerminalMac.entitlements
    dependencies:
      - package: IPhoneTerminal
        product: IPhoneTerminalCore
      - package: IPhoneTerminal
        product: IPhoneTerminalSecurity
      - package: IPhoneTerminal
        product: IPhoneTerminalCloud
