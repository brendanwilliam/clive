name: iPhoneTerminal
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  IPhoneTerminalCore:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
targets:
  iPhoneTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/iPhoneTerminal.entitlements
    dependencies:
      - package: IPhoneTerminalCore
        product: IPhoneTerminalCore
      - package: IPhoneTerminalCore
        product: IPhoneTerminalSecurity
      - package: IPhoneTerminalCore
        product: IPhoneTerminalCloud
      - package: SwiftTerm
        product: SwiftTerm
      - target: CliveResumeWidget
        embed: true
  CliveResumeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_NAME: CliveResumeWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(IPHONE_TERMINAL_BUNDLE_ID).widget
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
  iPhoneTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: iPhoneTerminal
