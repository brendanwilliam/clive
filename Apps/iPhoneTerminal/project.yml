name: iPhoneTerminal
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  IPhoneTerminalCore:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
targets:
  iPhoneTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Mac pairing code.
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock access to your paired Mac terminals.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Find paired Macs on the local network.
        INFOPLIST_KEY_NSBonjourServices: _iphone-terminal._tcp
    dependencies:
      - package: IPhoneTerminalCore
        product: IPhoneTerminalCore
      - package: IPhoneTerminalCore
        product: IPhoneTerminalSecurity
      - package: SwiftTerm
        product: SwiftTerm
  iPhoneTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: iPhoneTerminal
