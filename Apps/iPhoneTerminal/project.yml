name: iPhoneTerminal
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  IPhoneTerminalCore:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.15.0
targets:
  iPhoneTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.iphoneterminal
        SWIFT_VERSION: 6.0
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a Mac pairing code.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Find paired Macs on the local network.
        INFOPLIST_KEY_NSBonjourServices: _iphone-terminal._tcp
    dependencies:
      - package: IPhoneTerminalCore
        product: IPhoneTerminalCore
      - package: SwiftTerm
        product: SwiftTerm
