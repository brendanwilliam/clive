name: iPhoneTerminal
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  IPhoneTerminalCore:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
targets:
  iPhoneTerminal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
    dependencies:
      - package: IPhoneTerminalCore
        product: IPhoneTerminalCore
      - package: IPhoneTerminalCore
        product: IPhoneTerminalSecurity
      - package: SwiftTerm
        product: SwiftTerm
  iPhoneTerminalTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    dependencies:
      - target: iPhoneTerminal
