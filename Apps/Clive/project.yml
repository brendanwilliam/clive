name: Clive
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  CliveCore:
    path: ../..
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
targets:
  Clive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [App]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        PRODUCT_MODULE_NAME: Clive
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Clive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CliveCore
        product: CliveCore
      - package: CliveCore
        product: CliveSecurity
      - package: CliveCore
        product: CliveCloud
      - package: SwiftTerm
        product: SwiftTerm
      - target: CliveResumeWidget
        embed: true
  CliveResumeWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Widgets]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_NAME: CliveResumeWidget
        PRODUCT_BUNDLE_IDENTIFIER: $(CLIVE_BUNDLE_ID).widget
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/CliveWidget.entitlements
  CliveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clive - CLI for iOS.app/Clive - CLI for iOS"
    dependencies:
      - target: Clive
schemes:
  Clive:
    build:
      targets:
        Clive: all
        CliveTests: [test]
    test:
      targets:
        - CliveTests
