name: CliveMac
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  Clive:
    path: ../..
targets:
  CliveMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - App
      - path: ../../Sources/CliveDaemon
        excludes: [main.swift]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/CliveMac.entitlements
        Release:
          CLIVE_ICLOUD_CONTAINER: $(CLIVE_RELEASE_ICLOUD_CONTAINER)
          CODE_SIGN_IDENTITY: $(CLIVE_RELEASE_CODE_SIGN_IDENTITY)
          CODE_SIGN_ENTITLEMENTS: Config/CliveMacRelease.entitlements
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          CODE_SIGN_STYLE: Manual
          DEVELOPMENT_TEAM: $(CLIVE_RELEASE_TEAM_ID)
          ENABLE_HARDENED_RUNTIME: YES
          OTHER_CODE_SIGN_FLAGS: --timestamp --options runtime
          PRODUCT_BUNDLE_IDENTIFIER: $(CLIVE_RELEASE_BUNDLE_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(CLIVE_RELEASE_PROVISIONING_PROFILE)
    dependencies:
      - package: Clive
        product: CliveCore
      - package: Clive
        product: CliveSecurity
      - package: Clive
        product: CliveCloud
