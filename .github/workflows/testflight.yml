name: Deploy iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App version shown in TestFlight
        required: true
        default: "1.0"
  workflow_call:
    inputs:
      marketing_version:
        description: App version shown in TestFlight
        required: true
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Archive and upload
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CLIVE_BUNDLE_ID: ${{ vars.CLIVE_BUNDLE_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
      APPLE_DEVELOPMENT_CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_BASE64 }}
      APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
      WIDGET_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.WIDGET_APP_STORE_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            APPLE_TEAM_ID
            CLIVE_BUNDLE_ID
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_API_ISSUER_ID
            APP_STORE_CONNECT_API_PRIVATE_KEY
            APPLE_DEVELOPMENT_CERTIFICATE_BASE64
            APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD
            APP_STORE_PROVISIONING_PROFILE_BASE64
            WIDGET_APP_STORE_PROVISIONING_PROFILE_BASE64
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing TestFlight configuration: $name"
              exit 1
            fi
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify release SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "::error::App Store Connect requires the iOS 26 SDK or later; found $sdk_version"
            exit 1
          fi

      - name: Install signing assets and API key
        shell: bash
        run: |
          set -euo pipefail
          development_certificate_path="$RUNNER_TEMP/development.p12"
          distribution_certificate_path="$RUNNER_TEMP/distribution.p12"
          app_profile_path="$RUNNER_TEMP/app.mobileprovision"
          widget_profile_path="$RUNNER_TEMP/widget.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(uuidgen)"
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          printf '%s' "$APPLE_DEVELOPMENT_CERTIFICATE_BASE64" | base64 --decode > "$development_certificate_path"
          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$distribution_certificate_path"
          printf '%s' "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$app_profile_path"
          printf '%s' "$WIDGET_APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$widget_profile_path"
          printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" > "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$development_certificate_path" \
            -P "$APPLE_DEVELOPMENT_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security import "$distribution_certificate_path" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          profile_directory="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_directory"
          security cms -D -i "$app_profile_path" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$widget_profile_path" > "$RUNNER_TEMP/widget-profile.plist"
          app_group="group.$CLIVE_BUNDLE_ID"
          icloud_container="iCloud.$CLIVE_BUNDLE_ID"
          for profile in "$RUNNER_TEMP/app-profile.plist" "$RUNNER_TEMP/widget-profile.plist"; do
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$profile" | grep -Fq "$app_group"; then
              echo "::error::Provisioning profile $(basename "$profile") does not include app group $app_group"
              exit 1
            fi
          done
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.icloud-container-identifiers' "$RUNNER_TEMP/app-profile.plist" | grep -Fq "$icloud_container"; then
            echo "::error::App provisioning profile does not include iCloud container $icloud_container"
            exit 1
          fi
          if [[ $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/app-profile.plist") != production ]]; then
            echo "::error::App provisioning profile does not use the production APNs environment"
            exit 1
          fi
          app_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/app-profile.plist")"
          widget_profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/widget-profile.plist")"
          cp "$app_profile_path" "$profile_directory/$app_profile_uuid.mobileprovision"
          cp "$widget_profile_path" "$profile_directory/$widget_profile_uuid.mobileprovision"

          echo "API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "APP_PROFILE_UUID=$app_profile_uuid" >> "$GITHUB_ENV"
          echo "WIDGET_PROFILE_UUID=$widget_profile_uuid" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: Apps/Clive
        run: xcodegen generate

      - name: Archive app
        run: |
          set -o pipefail
          xcodebuild \
            -project Apps/Clive/Clive.xcodeproj \
            -scheme Clive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Clive.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CLIVE_BUNDLE_ID="$CLIVE_BUNDLE_ID" \
            MARKETING_VERSION="${{ inputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            archive

      - name: Upload archive to App Store Connect
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/TestFlightExportOptions.plist"
          cp Apps/Clive/Config/TestFlightExportOptions.plist "$export_options"
          plutil -replace teamID -string "$APPLE_TEAM_ID" "$export_options"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$CLIVE_BUNDLE_ID string $APP_PROFILE_UUID" "$export_options"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$CLIVE_BUNDLE_ID.widget string $WIDGET_PROFILE_UUID" "$export_options"

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Clive.xcarchive" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" && -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f \
            "${API_KEY_PATH:-}" \
            "$RUNNER_TEMP/development.p12" \
            "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/app.mobileprovision" \
            "$RUNNER_TEMP/widget.mobileprovision" \
            "$RUNNER_TEMP/app-profile.plist" \
            "$RUNNER_TEMP/widget-profile.plist" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID:-}.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_PROFILE_UUID:-}.mobileprovision"
