name: Verify Mac and iOS compatibility

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Shared tests and app builds
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Select Xcode 26.5
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: |
          test -x "${DEVELOPER_DIR}/usr/bin/xcodebuild" || {
            echo "::error::Pinned Xcode is unavailable at ${DEVELOPER_DIR}"
            exit 1
          }
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot an iOS Simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk '
            /^-- iOS / { in_ios = 1; next }
            /^-- / { if (in_ios) exit }
            in_ios && /iPhone/ && match($0, /\([0-9A-F-]{36}\)/) {
              print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ')"
          [[ -n "$simulator_id" ]] || { echo "::error::No available iPhone Simulator was found"; exit 1; }
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Verify both platforms
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: ./scripts/verify-local.sh

      - name: Verify localhost control socket
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: ./scripts/test-macos-integration.sh
