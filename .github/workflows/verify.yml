name: Verify Mac and iOS compatibility

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Shared tests and app builds
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Select Xcode 26.5
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: |
          test -x "${DEVELOPER_DIR}/usr/bin/xcodebuild" || {
            echo "::error::Pinned Xcode is unavailable at ${DEVELOPER_DIR}"
            exit 1
          }
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify both platforms
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
        run: ./scripts/verify-local.sh
