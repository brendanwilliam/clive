name: Verify main integration

on:
  pull_request:
    branches: [main]

concurrency:
  group: main-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: Shared tests and app builds
    if: github.head_ref == 'develop'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify runner Xcode
        run: |
          developer_dir="$(xcode-select -p)"
          test -x "${developer_dir}/usr/bin/xcodebuild" || {
            echo "::error::The runner's selected Xcode is unavailable at ${developer_dir}"
            exit 1
          }
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Boot an iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available | awk '
            /^-- iOS / { in_ios = 1; next }
            /^-- / { if (in_ios) exit }
            in_ios && /iPhone/ && match($0, /\([0-9A-F-]{36}\)/) {
              print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ')"
          [[ -n "$simulator_id" ]] || { echo "::error::No available iPhone Simulator was found"; exit 1; }
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
          echo "CLIVE_IOS_DESTINATION_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Verify both platforms
        run: ./scripts/verify-local.sh

      - name: Verify localhost control socket
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/clive-integration.keychain-db"
          keychain_password="$(uuidgen)"
          cleanup() { security delete-keychain "$keychain_path" 2>/dev/null || true; }
          trap cleanup EXIT
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 3600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          ./scripts/test-macos-integration.sh
