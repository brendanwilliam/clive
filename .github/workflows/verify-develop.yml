name: Continuous integration

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: develop-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-validation:
    name: Fast checks
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify runner Xcode
        run: |
          xcode-select -p
          xcrun --find swift
          swift --version

      - name: Run fast checks
        run: ./scripts/check-fast.sh "${{ github.event.pull_request.base.sha }}"
