name: Verify develop integration

on:
  pull_request:
    branches: [develop]

concurrency:
  group: develop-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-validation:
    name: Swift package tests and static checks
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify runner Xcode
        run: |
          xcode-select -p
          xcrun --find swift
          swift --version

      - name: Check whitespace errors
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Validate UI feature map
        run: python3 scripts/feature-map.py validate

      - name: Require a fresh UI feature map
        run: python3 scripts/feature-map.py check-change --base "${{ github.event.pull_request.base.sha }}"

      - name: Test UI feature map tooling
        run: python3 -m unittest discover -s Tests/FeatureMapTests

      - name: Run Swift package tests
        run: swift test

  compatibility:
    uses: ./.github/workflows/compatibility.yml
